services:
  mongodb:
    image: mongo:8.0
    container_name: mirexcargo-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-mirexcargo}

    ports:
      - "27017:27017"

    volumes:
      - mirexcargo_mongodb_data:/data/db

    networks:
      - mirexcargo-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  redis:
    image: redis:7.4-alpine
    container_name: mirexcargo-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6379:6379"

    volumes:
      - mirexcargo_redis_data:/data

    networks:
      - mirexcargo-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mirexcargo-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      HOST: ${HOST:-0.0.0.0}

      DB_URL: mongodb://mongodb:27017/mirexcargo
      DB_NAME: ${DB_NAME:-mirexcargo}

      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "${PORT:-5000}:5000"

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

    networks:
      - mirexcargo-network


  frontend:
    image: node:20-alpine
    container_name: mirexcargo-frontend
    restart: unless-stopped

    working_dir: /app

    environment:
      VITE_API_URL: ${API_URL:-http://localhost:5000}
      VITE_SOCKET_URL: ${API_URL:-http://localhost:5000}
      VITE_APP_NAME: ${APP_NAME:-MirexCargo}

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - mirexcargo_frontend_node_modules:/app/node_modules

    command:
      [
        "sh",
        "-c",
        "npm install && npm run dev -- --host 0.0.0.0"
      ]

    depends_on:
      - backend

    networks:
      - mirexcargo-network


networks:
  mirexcargo-network:
    name: mirexcargo-network
    driver: bridge


volumes:
  mirexcargo_mongodb_data:
    name: mirexcargo-mongodb-data

  mirexcargo_redis_data:
    name: mirexcargo-redis-data

  mirexcargo_frontend_node_modules:
    name: mirexcargo-frontend-node-modules